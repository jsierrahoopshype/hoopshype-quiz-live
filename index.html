<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HoopsHype NBA Quiz Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Poppins for the Matchup look, the same files as the Player Comparison generator (fonts/poppins, OFL) -->
<style>
@font-face { font-family: "Poppins"; font-weight: 600; src: url(fonts/poppins/poppins-600.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "Poppins"; font-weight: 700; src: url(fonts/poppins/poppins-700.woff2) format("woff2"); font-display: swap; }
</style>
<link rel="stylesheet" href="quiz.css">
</head>
<body data-layout="broadcast">
<!-- Fixed 1080x1920 portrait canvas (TikTok LIVE), scaled to fit the window -->
<div id="stage">
  <header id="masthead">
    <div class="wordmark"><img class="logo on-dark" src="img/hoopshype-logo-white.png" alt="HoopsHype"><img class="logo on-light" src="img/hoopshype-logo.png" alt="HoopsHype"><span class="sep"></span><span class="nq">NBA QUIZ</span></div>
    <div id="gameno"></div>
  </header>

  <div id="themebar">
    <div id="theme-name"></div>
    <div id="pips"></div>
  </div>

  <main id="panel">
    <div id="timebar"><div id="timefill"></div></div>
    <div id="panel-body"></div>
  </main>

  <div id="instruction"><span id="instr-text"></span><span id="clock"></span></div>
  <div id="eventline"></div>

  <section id="vote">
    <div class="sec-title">Pick the next theme: send its gift</div>
    <div id="vote-cols"></div>
  </section>

  <section id="standings">
    <div id="st-tabs"></div>
    <ol id="st-list"></ol>
    <div id="st-me"></div>
  </section>

  <section id="strips">
    <div class="strip"><span class="lab">Team battle</span><span class="items" id="lb-team"></span></div>
    <div class="strip"><span class="lab">Top supporters</span><span class="items" id="lb-gift"></span></div>
  </section>

  <footer id="likes">
    <div id="likefill"></div><div id="liketext"></div>
  </footer>
</div>
<script src="quiz.js"></script>
</body>
</html>
