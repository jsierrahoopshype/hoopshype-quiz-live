<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HoopsHype NBA Quiz Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<!-- Fixed 1080x1920 portrait canvas (TikTok LIVE), scaled to fit the window -->
<div id="stage">
  <header id="masthead">
    <div class="wordmark"><span class="hh">HOOPSHYPE</span><span class="sep"></span><span class="nq">NBA QUIZ</span></div>
    <div id="gameno"></div>
  </header>

  <div id="themebar">
    <div id="theme-name"></div>
    <div id="pips"></div>
  </div>

  <main id="panel">
    <div id="timebar"><div id="timefill"></div></div>
    <div id="panel-body"></div>
  </main>

  <div id="instruction"><span id="instr-text"></span><span id="clock"></span></div>
  <div id="eventline"></div>

  <section id="vote">
    <div class="sec-title">Pick the next theme: send its gift</div>
    <div id="vote-cols"></div>
  </section>

  <section id="tables">
    <div class="tbl"><div class="sec-title">This week</div><ol id="lb-week"></ol></div>
    <div class="tbl"><div class="sec-title">Team battle</div><ol id="lb-team"></ol></div>
    <div class="tbl"><div class="sec-title">Top supporters</div><ol id="lb-gift"></ol></div>
  </section>

  <footer id="likes">
    <div id="likefill"></div><div id="liketext"></div>
  </footer>
</div>
<script src="quiz.js"></script>
</body>
</html>
