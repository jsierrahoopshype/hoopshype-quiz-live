name: Rebuild question bank

# Mondays 05:17 UTC, plus a manual "Run workflow" button.
# Pulls fresh career totals, salaries, awards and jersey lists from the public HoopsMatic repos
# and commits data/questions.json only if the questions changed.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download public data
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash generator/fetch_sources.sh
      - name: Build questions
        run: python generator/build_questions.py --src sources --out data/questions.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/questions.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions.json
          git commit -m "Weekly question bank refresh"
          git push
