name: Rebuild question bank

# Every day at 10:47 UTC (about 5:47am ET, after last night's finals and the 10:23 standings update),
# plus a manual "Run workflow" button. Pulls the public HoopsMatic data repos, last night's top scorers
# (ESPN scoreboard, the feed nba-alt-standings already uses) and shot charts (public Hugging Face dataset),
# and commits data/questions.json only if the questions changed. No keys: only the built-in GitHub token.
on:
  schedule:
    - cron: '47 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download public data
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash generator/fetch_sources.sh
      - name: Build questions
        env:
          QUIZ_FETCH_SHOTS: '1'
          QUIZ_FETCH_ESPN: '1'
        run: python generator/build_questions.py --src sources --out data/questions.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/questions.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions.json
          git commit -m "Daily question bank refresh"
          git push
